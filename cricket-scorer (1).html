<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Cricket Scorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f0;min-height:100vh}
:root{--green:#0F6E56;--green-light:#E1F5EE;--border:#e0e0e0;--bg:#fff;--bg2:#f7f7f5;--text:#1a1a1a;--text2:#666;--radius:12px}
.app{max-width:480px;margin:0 auto;padding:12px}
.header{background:#0F6E56;color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:12px}
.header h1{font-size:20px;font-weight:600;margin-bottom:2px}
.header p{font-size:13px;opacity:.8}
.scoreboard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.score-main{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.score-runs{font-size:52px;font-weight:600;color:#1a1a1a;line-height:1}
.score-info{text-align:right}
.score-overs{font-size:15px;color:#666}
.score-rr{font-size:13px;color:#888}
.team-names{display:flex;justify-content:space-between;margin-bottom:8px}
.team-name{font-size:14px;font-weight:600;color:#1a1a1a}
.target-bar{font-size:13px;color:#666;margin-bottom:12px;padding:8px;background:#f7f7f5;border-radius:8px}
.this-over{margin-top:10px}
.over-label{font-size:12px;color:#888;margin-bottom:6px}
.balls-row{display:flex;gap:6px;flex-wrap:wrap}
.ball{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1px solid #ddd}
.ball-0{background:#f0f0ee;color:#555}
.ball-1,.ball-2,.ball-3{background:#E1F5EE;color:#0F6E56}
.ball-4{background:#E6F1FB;color:#0C447C;font-weight:700}
.ball-6{background:#EEEDFE;color:#3C3489;font-weight:700}
.ball-W{background:#FCEBEB;color:#791F1F;font-weight:700}
.ball-WD,.ball-NB{background:#FAEEDA;color:#633806}
.ball-empty{background:#f7f7f5;border:1px dashed #ccc}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tab{padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#666;white-space:nowrap;flex-shrink:0}
.tab.active{background:#0F6E56;color:#fff;border-color:#0F6E56}
.panel{display:none}.panel.active{display:block}
.scorecard-table{width:100%;font-size:13px;border-collapse:collapse}
.scorecard-table th{text-align:left;font-weight:600;font-size:12px;color:#888;padding:6px 8px;border-bottom:1px solid #eee}
.scorecard-table td{padding:7px 8px;border-bottom:1px solid #eee;color:#1a1a1a}
.scorecard-table td:last-child,.scorecard-table th:last-child{text-align:right}
.batting{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.section-title{font-size:12px;font-weight:600;color:#888;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.out-text{color:#aaa;font-size:11px}
.batting-row-active{background:#E1F5EE}
.scoring-panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.btn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.btn{padding:14px 4px;border-radius:10px;border:1px solid #ddd;cursor:pointer;font-size:16px;font-weight:600;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(.93);background:#f0f0ee}
.btn-4{background:#E6F1FB;color:#0C447C;border-color:#B5D4F4}
.btn-6{background:#EEEDFE;color:#3C3489;border-color:#CECBF6}
.btn-W{background:#FCEBEB;color:#791F1F;border-color:#F7C1C1}
.btn-wd,.btn-nb{background:#FAEEDA;color:#633806;border-color:#FAC775}
.btn-danger{background:#FCEBEB;color:#791F1F;border-color:#F7C1C1}
.extras-row{display:flex;gap:8px;margin-bottom:10px}
.extras-row .btn{flex:1;font-size:13px;padding:12px 4px}
.batters-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.batter-card{border:1px solid #ddd;border-radius:10px;padding:10px;cursor:pointer;background:#fff;-webkit-tap-highlight-color:transparent}
.batter-card.striker{border-color:#0F6E56;background:#E1F5EE}
.batter-name{font-size:13px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.batter-score{font-size:12px;color:#666}
.setup-panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.setup-panel h3{font-size:15px;font-weight:600;margin-bottom:14px;color:#1a1a1a}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:500}
.form-group input,.form-group select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;font-size:15px;background:#fff;color:#1a1a1a;-webkit-appearance:none}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#0F6E56}
.player-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.player-inputs input{margin-bottom:0}
.btn-primary{width:100%;padding:14px;background:#0F6E56;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;-webkit-tap-highlight-color:transparent}
.btn-primary:active{background:#085041}
.btn-secondary{width:100%;padding:12px;background:#f0f0ee;color:#1a1a1a;border:1px solid #ddd;border-radius:10px;font-size:15px;cursor:pointer;margin-top:8px}
.wicket-modal{background:#fff;border:1px solid #F7C1C1;border-radius:12px;padding:16px;margin-bottom:12px}
.wicket-modal h3{color:#791F1F;font-size:14px;font-weight:600;margin-bottom:12px}
.fow-table{width:100%;font-size:13px;border-collapse:collapse}
.fow-table th{font-size:12px;color:#888;font-weight:600;padding:5px 8px;border-bottom:1px solid #eee;text-align:left}
.fow-table td{padding:6px 8px;border-bottom:1px solid #eee}
.info-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #eee}
.info-row:last-child{border:none}
.msg{background:#E1F5EE;color:#0F6E56;border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:12px;border:1px solid #9FE1CB;font-weight:600}
.over-entry{padding:7px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px}
.bowler-info-bar{font-size:12px;color:#666;margin-bottom:10px;padding:8px 10px;background:#f7f7f5;border-radius:8px}
</style>
</head>
<body>
<div class="app" id="app">
<div class="header">
  <h1 id="match-title">🏏 Local Cricket Scorer</h1>
  <p id="match-subtitle">Set up a new match to begin</p>
</div>
<div id="main-content"></div>
</div>
<script>
const state={
  phase:'setup',
  match:{team1:'',team2:'',overs:20,tossWinner:'',batFirst:''},
  innings:1,
  team1Score:{runs:0,wickets:0,balls:0,extras:{wide:0,nb:0,bye:0,lb:0}},
  team2Score:{runs:0,wickets:0,balls:0,extras:{wide:0,nb:0,bye:0,lb:0}},
  batting:[],bowling:[],
  currentStrikerIdx:0,currentNonStrikerIdx:1,currentBowlerIdx:0,
  thisOverBalls:[],overHistory:[],fallOfWickets:[],
  wicketPending:false,outBatsmanIdx:-1,activeTab:'score',overJustEnded:false,editingStriker:false,extrasPanel:null
};
function currentScore(){return state.innings===1?state.team1Score:state.team2Score;}
function currentTarget(){return state.innings===2?state.team1Score.runs+1:null;}
function legalBalls(){return state.thisOverBalls.filter(b=>b!=='WD'&&b!=='NB').length;}
function totalOvers(s){return Math.floor(s.balls/6)+'.'+(s.balls%6);}
function runRate(s){return s.balls===0?'0.00':(s.runs/(s.balls/6)).toFixed(2);}
function getStriker(){return state.batting[state.currentStrikerIdx];}
function getNonStriker(){return state.batting[state.currentNonStrikerIdx];}
function getCurrentBowler(){return state.bowling[state.currentBowlerIdx];}
function swapBatters(){const t=state.currentStrikerIdx;state.currentStrikerIdx=state.currentNonStrikerIdx;state.currentNonStrikerIdx=t;}

function addRuns(r,legal=true){
  const sc=currentScore();sc.runs+=r;
  const bat=getStriker();const bowl=getCurrentBowler();
  if(legal){bat.runs+=r;bat.balls++;bowl.runs+=r;
    const lb=legalBalls()+1;
    state.thisOverBalls.push(String(r));sc.balls++;bowl.balls++;
    if(r===4)bat.fours++;if(r===6)bat.sixes++;
    if(r%2===1)swapBatters();
    if(lb>=6)endOver();
  }else{bowl.runs+=r;state.thisOverBalls.push(r===1?'WD':'NB');}
  render();
}
function openExtras(type){state.extrasPanel=type;render();}
function addWide(extra=0){
  const sc=currentScore();const bowl=getCurrentBowler();
  const total=1+extra;
  sc.runs+=total;bowl.runs+=total;
  sc.extras=sc.extras||{wide:0,nb:0};sc.extras.wide=(sc.extras.wide||0)+total;
  const label=extra>0?'WD+'+extra:'WD';
  state.thisOverBalls.push(label);
  if(extra%2===1)swapBatters();
  state.extrasPanel=null;render();
}
function addNoBall(extra=0){
  const sc=currentScore();const bowl=getCurrentBowler();
  const total=1+extra;
  sc.runs+=total;bowl.runs+=total;
  sc.extras=sc.extras||{wide:0,nb:0};sc.extras.nb=(sc.extras.nb||0)+1;
  if(extra>0){getStriker().runs+=extra;}
  const label=extra>0?'NB+'+extra:'NB';
  state.thisOverBalls.push(label);
  if(extra%2===1)swapBatters();
  state.extrasPanel=null;render();
}

function endOver(){
  state.overHistory.push([...state.thisOverBalls]);
  state.thisOverBalls=[];swapBatters();state.overJustEnded=true;
  getCurrentBowler().overs++;getCurrentBowler().balls=0;render();
}

function addWicket(){
  const bat=getStriker();bat.out=true;bat.howOut='c&b '+getCurrentBowler().name;
  getCurrentBowler().wickets++;currentScore().wickets++;
  state.fallOfWickets.push({score:currentScore().runs,wickets:currentScore().wickets,bat:bat.name,over:totalOvers(currentScore())});
  state.thisOverBalls.push('W');currentScore().balls++;getCurrentBowler().balls++;
  if(currentScore().wickets>=10){state.thisOverBalls=[];endInnings();return;}
  state.wicketPending=true;state.outBatsmanIdx=state.currentStrikerIdx;
  if(legalBalls()>=6){state.overHistory.push([...state.thisOverBalls]);state.thisOverBalls=[];state.overJustEnded=true;getCurrentBowler().overs++;getCurrentBowler().balls=0;}
  render();
}

function endInnings(){
  if(state.innings===1){
    state.innings=2;
    const t1=state.match.team1,t2=state.match.team2;
    const bat2=state.match.batFirst===t1?t2:t1;
    const bowl2=bat2===t1?t2:t1;
    const savedBowlers=state.bowling.map(b=>b.name);
    state.batting=Array.from({length:11},(_,i)=>({name:bat2+' P'+(i+1),runs:0,balls:0,fours:0,sixes:0,out:false,howOut:''}));
    state.bowling=savedBowlers.map(n=>({name:n,overs:0,balls:0,runs:0,wickets:0}));
    state.currentStrikerIdx=0;state.currentNonStrikerIdx=1;state.currentBowlerIdx=0;
    state.thisOverBalls=[];state.overHistory=[];state.fallOfWickets=[];
    state.wicketPending=false;state.overJustEnded=false;
  }else{state.phase='result';}
  render();
}

function confirmNewBatsman(){
  const name=document.getElementById('new-batsman-input').value.trim();
  if(!name)return;
  const nextIdx=state.batting.findIndex((b,i)=>!b.out&&i!==state.currentStrikerIdx&&i!==state.currentNonStrikerIdx);
  if(state.outBatsmanIdx===state.currentStrikerIdx){
    if(nextIdx===-1){state.batting.push({name,runs:0,balls:0,fours:0,sixes:0,out:false,howOut:''});state.currentStrikerIdx=state.batting.length-1;}
    else{state.batting[nextIdx].name=name;state.currentStrikerIdx=nextIdx;}
  }
  state.wicketPending=false;state.outBatsmanIdx=-1;render();
}

function confirmBowler(){
  const name=document.getElementById('bowler-input').value.trim();
  if(!name)return;
  let idx=state.bowling.findIndex(b=>b.name===name);
  if(idx===-1){state.bowling.push({name,overs:0,balls:0,runs:0,wickets:0});idx=state.bowling.length-1;}
  state.currentBowlerIdx=idx;state.overJustEnded=false;render();
}

function startMatch(){
  const t1=document.getElementById('t1').value.trim()||'Team 1';
  const t2=document.getElementById('t2').value.trim()||'Team 2';
  state.match.team1=t1;state.match.team2=t2;
  state.match.overs=parseInt(document.getElementById('ovs').value);
  const tossWon=document.getElementById('toss').value==='Team 1'?t1:t2;
  const elected=document.getElementById('elect').value;
  state.match.tossWinner=tossWon;
  state.match.batFirst=(elected==='Bat')?tossWon:(tossWon===t1?t2:t1);
  const batTeam=state.match.batFirst;
  const p1=Array.from({length:11},(_,i)=>document.getElementById('t1-p'+i)?.value.trim()||t1+' P'+(i+1));
  const p2=Array.from({length:11},(_,i)=>document.getElementById('t2-p'+i)?.value.trim()||t2+' P'+(i+1));
  const batPlayers=batTeam===t1?p1:p2;
  const bowlPlayers=batTeam===t1?p2:p1;
  state.batting=batPlayers.map(n=>({name:n,runs:0,balls:0,fours:0,sixes:0,out:false,howOut:''}));
  state.bowling=bowlPlayers.map(n=>({name:n,overs:0,balls:0,runs:0,wickets:0}));
  state.phase='scoring';render();
}

function ballClass(b){if(b==='W')return'W';if(b.startsWith('WD'))return'WD';if(b.startsWith('NB'))return'NB';if(b==='4')return'4';if(b==='6')return'6';if(b==='0')return'0';return'1';}
state.editingStriker=!state.editingStriker;render();}
function saveStrikerName(){
  const val=document.getElementById('striker-name-edit').value.trim();
  if(val)getStriker().name=val;
  state.editingStriker=false;render();
}

function renderSetup(){
  let html=`<div class="setup-panel"><h3>Match Setup</h3>
    <div class="form-group"><label>Team 1 Name</label><input id="t1" placeholder="e.g. Kathmandu XI"></div>
    <div class="form-group"><label>Team 2 Name</label><input id="t2" placeholder="e.g. Bhaktapur CC"></div>
    <div class="form-group"><label>Overs per innings</label><select id="ovs">
      ${[5,10,15,20,25,30,40,50].map(o=>`<option value="${o}"${o===20?' selected':''}>${o} overs</option>`).join('')}
    </select></div>
    <div class="form-group"><label>Toss won by</label><select id="toss"><option>Team 1</option><option>Team 2</option></select></div>
    <div class="form-group"><label>Elected to</label><select id="elect"><option>Bat</option><option>Bowl</option></select></div>
    <button class="btn-primary" onclick="startMatch()">▶ Start Match</button>
  </div>
  <div class="setup-panel"><h3>Team 1 — Playing XI</h3><div class="player-inputs">
    ${Array.from({length:11},(_,i)=>`<input id="t1-p${i}" placeholder="Player ${i+1}">`).join('')}
  </div></div>
  <div class="setup-panel"><h3>Team 2 — Playing XI</h3><div class="player-inputs">
    ${Array.from({length:11},(_,i)=>`<input id="t2-p${i}" placeholder="Player ${i+1}">`).join('')}
  </div></div>`;
  document.getElementById('main-content').innerHTML=html;
}

function renderScoring(){
  const sc=currentScore();
  const bat=state.match.batFirst;
  const bowl=bat===state.match.team1?state.match.team2:state.match.team1;
  const battingTeam=state.innings===1?bat:bowl;
  const target=currentTarget();
  const reqRuns=target?target-sc.runs:null;
  const reqBalls=target?(state.match.overs*6)-sc.balls:null;
  const reqRR=reqBalls&&reqBalls>0?(reqRuns/(reqBalls/6)).toFixed(2):'0.00';
  let html=`<div class="scoreboard">
    <div class="team-names"><span class="team-name">${battingTeam} 🏏</span><span style="font-size:13px;color:#888">Innings ${state.innings}</span></div>
    <div class="score-main">
      <div class="score-runs">${sc.runs}/${sc.wickets}</div>
      <div class="score-info"><div class="score-overs">${totalOvers(sc)} overs</div><div class="score-rr">RR: ${runRate(sc)}</div></div>
    </div>
    ${target?`<div class="target-bar">🎯 Need ${reqRuns} off ${reqBalls} balls | Req RR: ${reqRR}</div>`:''}
    <div class="this-over"><div class="over-label">This over</div><div class="balls-row">
      ${state.thisOverBalls.map(b=>`<div class="ball ball-${ballClass(b)}">${b}</div>`).join('')}
      ${Array(Math.max(0,6-legalBalls())).fill(0).map(()=>`<div class="ball ball-empty"></div>`).join('')}
    </div></div>
  </div>`;

  if(state.wicketPending){
    html+=`<div class="wicket-modal"><h3>🔴 Wicket! Who's coming in?</h3>
      <input id="new-batsman-input" placeholder="New batsman name" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;font-size:15px;margin-bottom:10px;background:#fff">
      <button class="btn-primary" onclick="confirmNewBatsman()">Send in Batsman</button></div>`;
  }else if(state.overJustEnded){
    html+=`<div class="wicket-modal" style="border-color:#B5D4F4"><h3 style="color:#185FA5">✅ Over complete! Next bowler?</h3>
      <input id="bowler-input" placeholder="Bowler name" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;font-size:15px;margin-bottom:10px;background:#fff">
      <button class="btn-primary" onclick="confirmBowler()">Confirm Bowler</button></div>`;
  }else{
    html+=`<div class="scoring-panel">
      <div class="batters-row">
        <div class="batter-card striker" style="position:relative">
          ${state.editingStriker
            ? `<div style="margin-bottom:4px;font-size:11px;color:#0F6E56;font-weight:600">✏️ Edit striker name</div>
               <input id="striker-name-edit" value="${getStriker().name}" style="width:100%;padding:7px 8px;border-radius:7px;border:1px solid #0F6E56;font-size:14px;margin-bottom:6px;background:#fff">
               <div style="display:flex;gap:6px">
                 <button onclick="saveStrikerName()" style="flex:1;padding:7px;background:#0F6E56;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer">Save</button>
                 <button onclick="toggleEditStriker()" style="flex:1;padding:7px;background:#f0f0ee;border:1px solid #ddd;border-radius:7px;font-size:13px;cursor:pointer">Cancel</button>
               </div>`
            : `<button onclick="toggleEditStriker()" style="position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:15px;padding:2px;line-height:1" title="Edit name">✏️</button>
               <div onclick="swapBatters();render()">
                 <div class="batter-name">* ${getStriker().name}</div>
                 <div class="batter-score">${getStriker().runs} (${getStriker().balls}b) ${getStriker().fours}×4 ${getStriker().sixes}×6</div>
               </div>`
          }
        </div>
        <div class="batter-card" onclick="swapBatters();render()">
          <div class="batter-name">${getNonStriker().name}</div>
          <div class="batter-score">${getNonStriker().runs} (${getNonStriker().balls}b) ${getNonStriker().fours}×4 ${getNonStriker().sixes}×6</div>
        </div>
      </div>
      <div class="bowler-info-bar">🎳 ${getCurrentBowler().name} — ${Math.floor(getCurrentBowler().balls/6)}.${getCurrentBowler().balls%6} ov · ${getCurrentBowler().runs}r · ${getCurrentBowler().wickets}w</div>
      ${state.extrasPanel ? `
      <div style="background:#FAEEDA;border:1px solid #FAC775;border-radius:10px;padding:12px;margin-bottom:10px">
        <div style="font-size:13px;font-weight:600;color:#633806;margin-bottom:8px">${state.extrasPanel==='WD'?'🟡 Wide':'🟠 No Ball'} — how many extra runs?</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px">
          ${[0,1,2,3,4,5,6].map(r=>`<button class="btn btn-wd" style="padding:12px 4px;font-size:15px" onclick="${state.extrasPanel==='WD'?'addWide':'addNoBall'}(${r})">${r===0?'0 extras':'+'+r}</button>`).join('')}
        </div>
        <button onclick="state.extrasPanel=null;render()" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer;color:#666">Cancel</button>
      </div>` : `
      <div class="btn-grid">
        <button class="btn" onclick="addRuns(0)">0</button>
        <button class="btn" onclick="addRuns(1)">1</button>
        <button class="btn" onclick="addRuns(2)">2</button>
        <button class="btn" onclick="addRuns(3)">3</button>
        <button class="btn btn-4" onclick="addRuns(4)">4</button>
        <button class="btn btn-6" onclick="addRuns(6)">6</button>
        <button class="btn btn-W" onclick="addWicket()">W</button>
        <button class="btn btn-wd" onclick="openExtras('WD')">Wide</button>
      </div>
      <div class="extras-row">
        <button class="btn btn-nb" onclick="openExtras('NB')">No Ball</button>
        <button class="btn" onclick="addRuns(5)">5 Runs</button>
        <button class="btn btn-danger" onclick="if(confirm('End innings now?'))endInnings()">End Inn.</button>
      </div>`}
      <div style="font-size:11px;color:#aaa;margin-top:4px;text-align:center">Tap batters above to swap strike</div>
    </div>`;
  }

  html+=`<div class="tabs">
    <div class="tab ${state.activeTab==='score'?'active':''}" onclick="setTab('score')">Live</div>
    <div class="tab ${state.activeTab==='batting'?'active':''}" onclick="setTab('batting')">Batting</div>
    <div class="tab ${state.activeTab==='bowling'?'active':''}" onclick="setTab('bowling')">Bowling</div>
    <div class="tab ${state.activeTab==='fow'?'active':''}" onclick="setTab('fow')">FoW</div>
    <div class="tab ${state.activeTab==='overs'?'active':''}" onclick="setTab('overs')">Overs</div>
  </div>`;

  if(state.activeTab==='score'){
    html+=`<div class="batting"><div class="section-title">At the crease</div>
      <div class="info-row"><span>Striker ⭐</span><span>${getStriker().name} — ${getStriker().runs}* (${getStriker().balls}b)</span></div>
      <div class="info-row"><span>Non-striker</span><span>${getNonStriker().name} — ${getNonStriker().runs} (${getNonStriker().balls}b)</span></div>
      <div class="info-row"><span>Bowler</span><span>${getCurrentBowler().name} — ${Math.floor(getCurrentBowler().balls/6)}.${getCurrentBowler().balls%6}-${getCurrentBowler().runs}-${getCurrentBowler().wickets}</span></div>
    </div>`;
  }else if(state.activeTab==='batting'){
    const activeBatters=[state.currentStrikerIdx,state.currentNonStrikerIdx];
    html+=`<div class="batting"><div class="section-title">Batting scorecard</div>
      <table class="scorecard-table"><tr><th>Batsman</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
      ${state.batting.map((b,i)=>`<tr class="${activeBatters.includes(i)?'batting-row-active':''}">
        <td>${b.name}${i===state.currentStrikerIdx?' *':''}<br><span class="out-text">${b.out?b.howOut:activeBatters.includes(i)?'batting':'dnb'}</span></td>
        <td>${b.runs}</td><td>${b.balls}</td><td>${b.fours}</td><td>${b.sixes}</td>
        <td>${b.balls>0?((b.runs/b.balls)*100).toFixed(0):'-'}</td></tr>`).join('')}
      </table></div>`;
  }else if(state.activeTab==='bowling'){
    html+=`<div class="batting"><div class="section-title">Bowling figures</div>
      <table class="scorecard-table"><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>
      ${state.bowling.map((b,i)=>`<tr class="${i===state.currentBowlerIdx?'batting-row-active':''}">
        <td>${b.name}${i===state.currentBowlerIdx?' †':''}</td>
        <td>${Math.floor(b.balls/6)}.${b.balls%6}</td><td>${b.runs}</td><td>${b.wickets}</td>
        <td>${b.balls>0?(b.runs/(b.balls/6)).toFixed(2):'-'}</td></tr>`).join('')}
      </table></div>`;
  }else if(state.activeTab==='fow'){
    html+=`<div class="batting"><div class="section-title">Fall of wickets</div>`;
    if(state.fallOfWickets.length===0)html+=`<p style="font-size:13px;color:#aaa">No wickets fallen yet.</p>`;
    else html+=`<table class="fow-table"><tr><th>Wkt</th><th>Score</th><th>Batsman</th><th>Over</th></tr>
      ${state.fallOfWickets.map((f,i)=>`<tr><td>${i+1}</td><td>${f.score}/${f.wickets}</td><td>${f.bat}</td><td>${f.over}</td></tr>`).join('')}</table>`;
    html+=`</div>`;
  }else if(state.activeTab==='overs'){
    html+=`<div class="batting"><div class="section-title">Over log</div>`;
    if(state.overHistory.length===0)html+=`<p style="font-size:13px;color:#aaa">No completed overs yet.</p>`;
    else state.overHistory.forEach((ov,i)=>{
      const rs=ov.filter(b=>b!=='WD'&&b!=='NB'&&b!=='W').reduce((a,b)=>a+(parseInt(b)||0),0);
      html+=`<div class="over-entry"><span style="font-size:12px;color:#888;min-width:50px">Over ${i+1}</span>
        <div class="balls-row">${ov.map(b=>`<div class="ball ball-${ballClass(b)}" style="width:28px;height:28px;font-size:10px">${b}</div>`).join('')}</div>
        <span style="font-size:13px;font-weight:600;margin-left:auto">${rs}r</span></div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('main-content').innerHTML=html;
}

function renderResult(){
  const s1=state.team1Score,s2=state.team2Score;
  const bat1=state.match.batFirst;
  const bat2=bat1===state.match.team1?state.match.team2:state.match.team1;
  let result='';
  if(s1.runs>s2.runs)result=bat1+' won by '+(s1.runs-s2.runs)+' runs 🏆';
  else if(s2.runs>s1.runs)result=bat2+' won by '+(10-s2.wickets)+' wickets 🏆';
  else result='Match tied! 🤝';
  document.getElementById('main-content').innerHTML=`
  <div class="scoreboard"><div class="msg">${result}</div>
    <div class="info-row"><span style="font-weight:600">${bat1}</span><span>${s1.runs}/${s1.wickets} (${totalOvers(s1)} ov)</span></div>
    <div class="info-row"><span style="font-weight:600">${bat2}</span><span>${s2.runs}/${s2.wickets} (${totalOvers(s2)} ov)</span></div>
  </div>
  <button class="btn-secondary" onclick="resetMatch()">🔄 New Match</button>`;
}

function resetMatch(){
  Object.assign(state,{phase:'setup',innings:1,
    team1Score:{runs:0,wickets:0,balls:0,extras:{wide:0,nb:0,bye:0,lb:0}},
    team2Score:{runs:0,wickets:0,balls:0,extras:{wide:0,nb:0,bye:0,lb:0}},
    batting:[],bowling:[],currentStrikerIdx:0,currentNonStrikerIdx:1,currentBowlerIdx:0,
    thisOverBalls:[],overHistory:[],fallOfWickets:[],wicketPending:false,outBatsmanIdx:-1,
    activeTab:'score',overJustEnded:false,editingStriker:false,extrasPanel:null,match:{team1:'',team2:'',overs:20,tossWinner:'',batFirst:''}});
  render();
}

function setTab(t){state.activeTab=t;render();}

function render(){
  document.getElementById('match-title').textContent='🏏 '+(state.match.team1&&state.match.team2?state.match.team1+' vs '+state.match.team2:'Local Cricket Scorer');
  if(state.phase==='setup'){document.getElementById('match-subtitle').textContent='Set up a new match to begin';renderSetup();}
  else if(state.phase==='scoring'){
    const bat=state.match.batFirst;const bowl=bat===state.match.team1?state.match.team2:state.match.team1;
    const battingTeam=state.innings===1?bat:bowl;
    document.getElementById('match-subtitle').textContent='Innings '+state.innings+' — '+battingTeam+' batting';
    renderScoring();
  }else{document.getElementById('match-subtitle').textContent='Match complete';renderResult();}
}
render();
</script>
</body>
</html>
